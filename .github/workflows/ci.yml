name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srm
          POSTGRES_PASSWORD: srm
          POSTGRES_DB: srm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://srm:srm@localhost:5432/srm_test?sslmode=disable
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - run: go test -tags=integration ./... -race
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
