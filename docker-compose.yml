services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
      POSTGRES_DB: srm
    ports: ["5432:5432"]
    # A partir do postgres 18, a imagem oficial passou a esperar o mount em
    # /var/lib/postgresql (não mais .../data) — guarda os dados num
    # subdiretório com nome versionado internamente. Ver
    # https://github.com/docker-library/postgres/pull/1259
    volumes: [srm-db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    # depends_on com service_healthy não garante que o postgres aceita
    # conexão no exato instante em que reporta healthy — houve corrida real
    # nesta verificação (api saiu com Exited(1) no primeiro `up`, subiu
    # normalmente no retry manual). Sem restart, uma corrida perdida deixa
    # o container morto em vez de se recuperar sozinho.
    restart: on-failure:3
    environment:
      DATABASE_URL: postgres://srm:srm@db:5432/srm?sslmode=disable
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      CAMBIO_URL: ""
      CAMBIO_TIMEOUT_MS: 2000
      # Caminho absoluto: dentro do container o cwd do usuário nonroot é
      # /home/nonroot, não a raiz onde o Dockerfile copia as migrations.
      MIGRATION_PATH: /migrations
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "--health"]
      interval: 10s
      retries: 3
      start_period: 15s

  carga:
    build: .
    depends_on:
      db: {condition: service_healthy}
    profiles: ["carga"]
    environment:
      DATABASE_URL: postgres://srm:srm@db:5432/srm?sslmode=disable
    entrypoint: ["/carga"]

  frontend:
    build:
      context: ../srm-frontend
      # rewrites() do Next.js é resolvido em build-time (congelado no
      # routes-manifest.json do output standalone) — precisa chegar como
      # build arg, environment: em runtime não tem efeito nenhum.
      args:
        API_INTERNAL_URL: http://api:8080
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]

  # Alvos de teste: usam o estágio "builder" do Dockerfile (com toolchain Go),
  # não a imagem final distroless. `docker compose run --rm test-unit`.
  # Sem -race: a imagem base golang:1.26-alpine roda com CGO_ENABLED=0 e não
  # tem toolchain C — -race exige cgo. O -race "de verdade" roda no runner
  # nativo do CI (.github/workflows/ci.yml), fora deste container; estes
  # alvos são a conveniência de rodar teste sem instalar Go localmente.
  test-unit:
    build:
      context: .
      target: builder
    profiles: ["test"]
    command: ["go", "test", "./...", "-coverprofile=/tmp/coverage.out"]

  # Testes de integração sobem seu próprio container Postgres via
  # testcontainers-go — precisam do socket do Docker do host montado
  # (padrão "Docker outside of Docker"), não do serviço "db" do compose.
  test-integration:
    build:
      context: .
      target: builder
    profiles: ["test"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["go", "test", "-tags=integration", "./..."]

volumes:
  srm-db-data:
    name: srm-db-data
