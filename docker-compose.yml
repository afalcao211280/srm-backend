services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
      POSTGRES_DB: srm
    ports: ["5432:5432"]
    volumes: [srm-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://srm:srm@db:5432/srm?sslmode=disable
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      CAMBIO_URL: ""
      CAMBIO_TIMEOUT_MS: 2000
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "--health"]
      interval: 10s
      retries: 3
      start_period: 15s

  carga:
    build: .
    depends_on:
      db: {condition: service_healthy}
    profiles: ["carga"]
    environment:
      DATABASE_URL: postgres://srm:srm@db:5432/srm?sslmode=disable
    entrypoint: ["/carga"]

volumes:
  srm-db-data:
    name: srm-db-data
