services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
      POSTGRES_DB: srm
    ports:
      - "5432:5432"
    volumes:
      - srm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  srm-db-data:
    name: srm-db-data
